name: Deploy DocFX to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Configure GitHub Packages source
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/Payroll-Engine/index.json" \
            --name github --username github-actions \
            --password ${{ secrets.PAT_DISPATCH }} \
            --store-password-in-clear-text

      - name: Update PE dependency versions
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          find . -name "*.csproj" | xargs sed -i -E \
            "s|(<PackageReference Include=\"PayrollEngine\.[^\"]*\" Version=\")[^\"]*\"|\1${VERSION}\"|g"
          echo "✅ PE dependencies patched to ${VERSION}"

      - name: Build
        run: dotnet publish Client.Services/PayrollEngine.Client.Services.csproj -c Release -o publish

      # PayrollEngine.Lex is no dependency of Client.Services: publish it from a temporary project
      - name: Add PayrollEngine.Lex
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          dotnet new classlib -n LexDocs -o "${RUNNER_TEMP}/LexDocs" --framework net10.0
          dotnet add "${RUNNER_TEMP}/LexDocs" package PayrollEngine.Lex --version "${VERSION}"
          dotnet publish "${RUNNER_TEMP}/LexDocs" -c Release -o "${RUNNER_TEMP}/LexDocs/publish"
          cp "${RUNNER_TEMP}/LexDocs/publish/PayrollEngine.Lex.dll" "${RUNNER_TEMP}/LexDocs/publish/PayrollEngine.Lex.xml" publish/
          echo "✅ PayrollEngine.Lex ${VERSION} added to publish"

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build DocFX
        run: cd docfx && docfx docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docfx/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
